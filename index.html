<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tactical Arena Multiplayer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151d;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:20px;left:20px;text-shadow:0 2px 5px #000;font-weight:700;line-height:1.8;pointer-events:none}#network{font-size:12px;color:#a7e5b8}#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;width:5px;height:5px;border-radius:50%;box-shadow:0 0 4px #000;pointer-events:none}#hit{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);height:18px;width:18px;border:2px solid white;opacity:0;pointer-events:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#070c13bf;backdrop-filter:blur(5px)}#panel{max-width:480px;width:90%;padding:30px;background:#1d2835;border:1px solid #566272;border-radius:12px;text-align:center;box-shadow:0 20px 70px #0009}h1{letter-spacing:3px}p{line-height:1.6;color:#becbda}button,input{font:inherit;padding:12px;border-radius:5px}button{width:100%;cursor:pointer;background:#ee7435;color:white;border:0;font-weight:bold;margin-top:10px}button.secondary{background:#36465a}#status{font-size:13px;overflow-wrap:anywhere;margin-top:15px;color:#b6cae0}#damage{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 35%,#f22929a0);opacity:0;transition:opacity .15s}#feed{position:fixed;right:20px;top:20px;text-align:right;font-weight:bold;text-shadow:0 2px 5px #000}#hint{position:fixed;bottom:15px;text-align:center;width:100%;font-size:12px;color:#cbd3d9;pointer-events:none}</style></head><body>
<canvas id="game"></canvas><div id="hud"><div id="health">HEALTH: 100</div><div id="online">PLAYERS ONLINE: 1</div><div id="network">CONNECTING…</div><div id="room"></div></div><div id="crosshair"></div><div id="hit"></div><div id="damage"></div><div id="feed"></div><div id="hint">WASD MOVE · SHIFT SPRINT · MOUSE AIM · LEFT CLICK FIRE · ESC MENU</div><div id="overlay"><div id="panel"><h1>TACTICAL ARENA</h1><p>Online multiplayer tactical shooter. Share your room link to play together. Your browser hosts the room.</p><button id="start">ENTER ARENA</button><button id="copy" class="secondary">COPY ROOM LINK</button><div id="status">Starting multiplayer…</div></div></div><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script type="module" src="./game.js"></script></body></html>
